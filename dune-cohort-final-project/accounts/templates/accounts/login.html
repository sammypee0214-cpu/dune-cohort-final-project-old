{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<h1>Log in</h1>

<div class="panel form-panel">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="actions">
      <button type="submit" class="btn">Log in</button>
    </div>
  </form>
  <p class="muted">No account yet? <a href="{% url 'accounts:register' %}">Register here</a>.</p>
</div>
{% endblock %}
