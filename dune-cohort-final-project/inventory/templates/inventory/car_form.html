{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<h1>{{ heading }}</h1>

<div class="panel form-panel">
  {# enctype is required for the image upload field #}
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button type="submit" class="btn">Save car</button>
      <a class="btn btn-secondary" href="{% if car %}{{ car.get_absolute_url }}{% else %}{% url 'inventory:car_list' %}{% endif %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
