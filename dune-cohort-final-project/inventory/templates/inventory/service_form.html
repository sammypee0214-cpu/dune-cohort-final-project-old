{% extends "base.html" %}

{% block title %}Add service record{% endblock %}

{% block content %}
<h1>Add service record</h1>
<p class="muted">For <a href="{{ car.get_absolute_url }}">{{ car }}</a></p>

<div class="panel form-panel">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button type="submit" class="btn">Save record</button>
      <a class="btn btn-secondary" href="{{ car.get_absolute_url }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
